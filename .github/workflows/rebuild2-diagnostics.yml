name: Rebuild 2 diagnostics

on:
  push:
    branches:
      - rebuild/po-chasam-2
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npm run type-check > typecheck.log 2>&1
      - name: Web export
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          code=$?
          echo "$code" > build.exit
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: rebuild2-diagnostics
          path: |
            typecheck.log
            build.log
            build.exit
          if-no-files-found: error
