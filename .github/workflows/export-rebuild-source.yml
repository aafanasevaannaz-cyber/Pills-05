name: Apply rebuild 2 patch

permissions:
  contents: write

on:
  pull_request:
    branches:
      - claude/setup-documentation-uVAKM
  workflow_dispatch:

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/po-chasam-2
          fetch-depth: 0

      - name: Apply patch and clean temporary files
        run: |
          set +e
          : > /tmp/rebuild2-error.txt
          cat .github/rebuild2-patch/part-* | base64 -d > /tmp/rebuild2.patch.gz 2>> /tmp/rebuild2-error.txt
          DECODE_STATUS=$?
          gzip -dc /tmp/rebuild2.patch.gz > /tmp/rebuild2.patch 2>> /tmp/rebuild2-error.txt
          GZIP_STATUS=$?
          git apply --check /tmp/rebuild2.patch >> /tmp/rebuild2-error.txt 2>&1
          CHECK_STATUS=$?
          printf '\ndecode=%s gzip=%s apply_check=%s\n' "$DECODE_STATUS" "$GZIP_STATUS" "$CHECK_STATUS" >> /tmp/rebuild2-error.txt

          if [ "$DECODE_STATUS" -ne 0 ] || [ "$GZIP_STATUS" -ne 0 ] || [ "$CHECK_STATUS" -ne 0 ]; then
            cp /tmp/rebuild2-error.txt .github/rebuild2-apply-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/rebuild2-apply-error.txt
            git commit -m "Сохранить диагностику применения патча"
            git push origin HEAD:rebuild/po-chasam-2
            exit 1
          fi

          set -e
          git apply --index /tmp/rebuild2.patch
          rm -rf .github/rebuild2-patch
          rm -f .github/rebuild2-apply-error.txt
          rm -f .github/workflows/apply-rebuild2.yml
          rm -f .github/workflows/export-rebuild-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Пересобрать расписание, редактирование и аудио"
          git push origin HEAD:rebuild/po-chasam-2
