name: Android verification

on:
  push:
    branches:
      - fix/android-ready-20260719-working
      - rebuild/po-chasam-2
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        shell: bash
        run: |
          set +e
          npm run type-check > typecheck.log 2>&1
          status=$?
          cat typecheck.log
          exit $status

      - name: Upload TypeScript diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-typecheck-log
          path: typecheck.log
          if-no-files-found: ignore

      - name: Export web application
        shell: bash
        run: |
          set +e
          npm run build > web-build.log 2>&1
          status=$?
          cat web-build.log
          exit $status

      - name: Upload web build diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-web-build-log
          path: web-build.log
          if-no-files-found: ignore

      - name: Sync Capacitor Android
        shell: bash
        run: |
          set +e
          npx cap sync android > capacitor-sync.log 2>&1
          status=$?
          cat capacitor-sync.log
          exit $status

      - name: Upload Capacitor diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-capacitor-log
          path: capacitor-sync.log
          if-no-files-found: ignore

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug > ../gradle-build.log 2>&1
          status=$?
          tail -n 120 ../gradle-build.log
          exit $status

      - name: Verify and persist final APK
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$apk"
          sha256sum "$apk" | tee Pills-final-20260815-sha256.txt
          mkdir -p /tmp/pills-final
          cp "$apk" /tmp/pills-final/Pills-final-20260815.apk
          cp Pills-final-20260815-sha256.txt /tmp/pills-final/sha256.txt
          git fetch origin "$HEAD_BRANCH"
          if git ls-tree -r "origin/$HEAD_BRANCH" --name-only | grep -qx 'preview/Pills-final-20260815.apk'; then
            echo 'Preview APK already persisted on head branch; skipping commit.'
            exit 0
          fi
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          mkdir -p preview
          cp /tmp/pills-final/Pills-final-20260815.apk preview/Pills-final-20260815.apk
          cp /tmp/pills-final/sha256.txt preview/Pills-final-20260815-sha256.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f preview/Pills-final-20260815.apk preview/Pills-final-20260815-sha256.txt
          git commit -m 'ci: attach Pills final APK [skip ci]'
          git push origin HEAD:"$HEAD_BRANCH"

      - name: Upload Gradle diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-gradle-log
          path: gradle-build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
