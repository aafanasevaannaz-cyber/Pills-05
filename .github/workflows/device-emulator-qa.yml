name: Three-device emulator QA

on:
  pull_request:
    branches:
      - claude/setup-documentation-uVAKM
    paths:
      - '.github/workflows/device-emulator-qa.yml'
      - 'qa/android/**'
      - 'src/**'
      - 'android/**'
      - 'package.json'
      - 'capacitor.config.ts'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run type-check

      - name: Export and sync Android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pills-qa-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

  emulator-qa:
    needs: build-apk
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile_name: realme-c55
            api_level: 35
            width: 1080
            height: 2400
            density: 400
            tablet: 'false'
          - profile_name: samsung-galaxy-tab-a11-plus
            api_level: 36
            width: 1200
            height: 1920
            density: 240
            tablet: 'true'
          - profile_name: lenovo-tab-m10-fhd-plus
            api_level: 29
            width: 1200
            height: 1920
            density: 240
            tablet: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: pills-qa-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Create and boot emulator
        id: emulator
        continue-on-error: true
        env:
          PROFILE_NAME: ${{ matrix.profile_name }}
          API_LEVEL: ${{ matrix.api_level }}
        run: |
          set -o pipefail
          RESULT_DIR="qa-results/${PROFILE_NAME}"
          mkdir -p "${RESULT_DIR}/logs"
          SETUP_LOG="${RESULT_DIR}/logs/emulator-setup.txt"
          SYSTEM_IMAGE="system-images;android-${API_LEVEL};google_apis;x86_64"
          AVD_NAME="qa-${PROFILE_NAME}"

          SDKMANAGER="$(find -L "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          AVDMANAGER="$(find -L "${ANDROID_HOME}/cmdline-tools" -type f -name avdmanager 2>/dev/null | sort | tail -n 1)"
          EMULATOR="${ANDROID_HOME}/emulator/emulator"
          ADB="${ANDROID_HOME}/platform-tools/adb"

          {
            echo "ANDROID_HOME=${ANDROID_HOME}"
            echo "SYSTEM_IMAGE=${SYSTEM_IMAGE}"
            echo "AVD_NAME=${AVD_NAME}"
            echo "SDKMANAGER=${SDKMANAGER}"
            echo "AVDMANAGER=${AVDMANAGER}"
            echo "EMULATOR=${EMULATOR}"
            echo "ADB=${ADB}"
            test -x "${SDKMANAGER}"
            test -x "${AVDMANAGER}"
            test -x "${ADB}"
            yes | "${SDKMANAGER}" --licenses >/dev/null || true
            "${SDKMANAGER}" "platform-tools" "emulator" "${SYSTEM_IMAGE}"
            test -x "${EMULATOR}"
            echo no | "${AVDMANAGER}" create avd --force --name "${AVD_NAME}" --package "${SYSTEM_IMAGE}" --device "pixel_2"
            "${EMULATOR}" -list-avds
          } 2>&1 | tee "${SETUP_LOG}"

          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:$(dirname "${SDKMANAGER}"):${PATH}"
          nohup "${EMULATOR}" \
            -avd "${AVD_NAME}" \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            -memory 4096 \
            -cores 2 \
            > "${RESULT_DIR}/logs/emulator-runtime.txt" 2>&1 &
          echo $! > "${RESULT_DIR}/emulator.pid"

          BOOTED=0
          for attempt in $(seq 1 72); do
            "${ADB}" devices -l | tee "${RESULT_DIR}/logs/adb-devices-latest.txt"
            if "${ADB}" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' | grep -q '^1$'; then
              BOOTED=1
              break
            fi
            sleep 5
          done

          if [ "${BOOTED}" -ne 1 ]; then
            echo "Эмулятор не загрузился за 6 минут." | tee "${RESULT_DIR}/crash-message.txt"
            "${ADB}" devices -l >> "${RESULT_DIR}/logs/emulator-setup.txt" 2>&1 || true
            exit 1
          fi

          "${ADB}" shell input keyevent 82 || true
          "${ADB}" shell settings put global window_animation_scale 0 || true
          "${ADB}" shell settings put global transition_animation_scale 0 || true
          "${ADB}" shell settings put global animator_duration_scale 0 || true
          echo "Эмулятор загружен." | tee -a "${RESULT_DIR}/logs/emulator-setup.txt"

      - name: Run complete adb QA scenario
        id: qa
        if: steps.emulator.outcome == 'success'
        continue-on-error: true
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:${PATH}"
          command -v adb
          command -v bash
          command -v python3
          chmod +x qa/android/run_device_qa.sh qa/android/ui_pick.py
          bash qa/android/run_device_qa.sh \
            '${{ matrix.profile_name }}' \
            '${{ matrix.width }}' \
            '${{ matrix.height }}' \
            '${{ matrix.density }}' \
            '${{ matrix.tablet }}' \
            'apk/app-debug.apk'

      - name: Record infrastructure failure
        if: steps.emulator.outcome != 'success'
        run: |
          RESULT_DIR="qa-results/${{ matrix.profile_name }}"
          mkdir -p "${RESULT_DIR}/logs"
          echo "Тест приложения не начался: эмулятор Android не загрузился. Подробности в logs/emulator-setup.txt и logs/emulator-runtime.txt." > "${RESULT_DIR}/summary.md"
          test -f "${RESULT_DIR}/actions.txt" || echo "Действия с приложением не выполнялись: эмулятор не загрузился." > "${RESULT_DIR}/actions.txt"
          test -f "${RESULT_DIR}/crash-message.txt" || echo "Сообщение о падении приложения отсутствует, потому что APK не был запущен." > "${RESULT_DIR}/crash-message.txt"

      - name: Upload complete QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-${{ matrix.profile_name }}
          path: qa-results/${{ matrix.profile_name }}
          if-no-files-found: error
          retention-days: 14

      - name: Fail job after evidence upload
        if: steps.emulator.outcome != 'success' || steps.qa.outcome == 'failure'
        run: exit 1
