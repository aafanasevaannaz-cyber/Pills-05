name: Apply rebuild 2 patch

permissions:
  contents: write

on:
  pull_request:
    branches:
      - claude/setup-documentation-uVAKM
  workflow_dispatch:

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/po-chasam-2
          fetch-depth: 0

      - name: Apply patch and clean temporary files
        run: |
          cat .github/rebuild2-patch/part-* | base64 -d | gzip -d > /tmp/rebuild2.patch
          git apply --index /tmp/rebuild2.patch
          rm -rf .github/rebuild2-patch
          rm -f .github/workflows/apply-rebuild2.yml
          rm -f .github/workflows/export-rebuild-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Пересобрать расписание, редактирование и аудио"
          git push origin HEAD:rebuild/po-chasam-2
