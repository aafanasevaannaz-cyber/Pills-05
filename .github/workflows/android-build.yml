name: Android build

on:
  push:
    branches:
      - fix/android-ready-20260719-code-final
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: npm run type-check > typecheck.log 2>&1

      - name: Report typecheck errors
        if: steps.typecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "TypeScript errors:"
          cat typecheck.log
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### TypeScript errors'
              echo '```text'
              sed -n '1,160p' typecheck.log
              echo '```'
            } > typecheck-comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file typecheck-comment.md
          fi
          exit 1

      - name: Build static web app and sync Android
        run: npm run android:sync

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pills-05-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
