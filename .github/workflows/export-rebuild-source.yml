name: Export rebuild source

on:
  push:
    branches:
      - rebuild/po-chasam-2
  pull_request:
    branches:
      - claude/setup-documentation-uVAKM
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack repository source
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=.next --exclude=out --exclude=android/.gradle --exclude=android/app/build -czf rebuild-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: rebuild-source
          path: rebuild-source.tar.gz
          if-no-files-found: error
          retention-days: 3
